<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <defs>
    <!-- Authentic R&S Pioneer Brand Colors -->
    <linearGradient id="rspNavyBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F5C" />
      <stop offset="100%" stop-color="#071E3C" />
    </linearGradient>
    <linearGradient id="rspCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#C1272D" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="rspPillRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="rspPillBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="rspEmblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#071E3C" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Left Iconic Emblem: Authentic Mortar & Pestle + Storefront Capsules -->
  <g transform="translate(4, 5)" filter="url(#rspEmblemGlow)">
    <!-- Shield / Canopy Arch Base in Storefront Navy -->
    <rect width="66" height="66" rx="18" fill="url(#rspNavyBadge)" />
    <!-- Fine Border Ring -->
    <rect x="1" y="1" width="64" height="64" rx="17" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2" />

    <!-- Storefront Awning Two-Pill Graphic (Top Right of Badge) -->
    <g transform="translate(43, 8) rotate(35)">
      <!-- Pill 1: Red / White Capsule -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="6" height="13" rx="3" fill="#FFFFFF" />
        <path d="M0 3 C0 1.34 1.34 0 3 0 C4.66 0 6 1.34 6 3 L6 6.5 L0 6.5 Z" fill="url(#rspPillRed)" />
        <line x1="0" y1="6.5" x2="6" y2="6.5" stroke="#7F1D1D" stroke-width="0.5" />
      </g>
      <!-- Pill 2: Blue / White Capsule -->
      <g transform="translate(7, 3) rotate(-20)">
        <rect x="0" y="0" width="5.5" height="12" rx="2.75" fill="#FFFFFF" />
        <path d="M0 2.75 C0 1.23 1.23 0 2.75 0 C4.27 0 5.5 1.23 5.5 2.75 L5.5 6 L0 6 Z" fill="url(#rspPillBlue)" />
        <line x1="0" y1="6" x2="5.5" y2="6" stroke="#1E3A8A" stroke-width="0.5" />
      </g>
    </g>

    <!-- Apothecary Mortar & Pestle (Pure White Graphic matching Canopy Dome) -->
    <!-- Pestle (Angled diagonally into mortar) -->
    <g transform="rotate(26 31 35)">
      <rect x="29" y="11" width="6" height="19" rx="3" fill="#FFFFFF" />
      <!-- Pestle shadow/accent line -->
      <path d="M29 14 C29 12.5 30 11.5 32 11.5 C34 11.5 35 12.5 35 14 L35 19 L29 19 Z" fill="#E2E8F0" />
    </g>

    <!-- Mortar Bowl Rim -->
    <ellipse cx="31" cy="30" rx="19" ry="3.5" fill="#E2E8F0" />
    <ellipse cx="31" cy="29.2" rx="17.5" ry="2.8" fill="#FFFFFF" />

    <!-- Mortar Main Body (Classic flared apothecary bowl) -->
    <path d="M13.5 30 C14 43.5 21 49 31 49 C41 49 48 43.5 48.5 30 Z" fill="#FFFFFF" />

    <!-- Mortar Pedestal Foot -->
    <path d="M24 48.5 L22 53.5 C22 54.5 40 54.5 40 53.5 L38 48.5 Z" fill="#E2E8F0" />
    <rect x="21" y="52.5" width="20" height="2" rx="1" fill="#FFFFFF" />

    <!-- Inside Mortar: Bold Crimson Rx Monogram (from Awning Dome) -->
    <text x="31" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" fill="url(#rspCrimsonGrad)" letter-spacing="-0.5">℞</text>
  </g>

  <!-- Brand Typography: True to Storefront Signage -->
  <g transform="translate(80, 8)">
    
    <!-- Top Row: "R & S" (Crimson) + "PIONEER" (Deep Navy) -->
    <g transform="translate(0, 24)">
      <!-- "R & S" in Crimson Red with custom ampersand -->
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" fill="url(#rspCrimsonGrad)" letter-spacing="-0.5">
        R&amp;S
      </text>

      <!-- Dot divider -->
      <circle cx="56" cy="-7" r="2.5" fill="#C1272D" />

      <!-- "PIONEER" in Deep Navy #0B2F5C -->
      <text x="66" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" fill="#0B2F5C" letter-spacing="-0.2">
        PIONEER
      </text>
    </g>

    <!-- Middle Row: "PHARMACY" (Authoritative, Bold, Clean Sans-Serif) -->
    <g transform="translate(1, 44)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="14.5" fill="#0B2F5C" letter-spacing="4.2">
        PHARMACY
      </text>
    </g>

    <!-- Bottom Row: Authenticity & Trust Subtitle -->
    <g transform="translate(1, 57)">
      <!-- Subtle red accent rule -->
      <line x1="0" y1="-2" x2="238" y2="-2" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="2" cy="4" r="2" fill="#10B981" />
      <text x="8" y="7" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="8" fill="#64748B" letter-spacing="0.6">
        BRONX, NY • EST. 2006 • WE CARE ABOUT YOU!
      </text>
    </g>

  </g>
</svg>
