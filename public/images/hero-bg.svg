<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="heroGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1A4FA0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#071E3C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#C1272D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#071E3C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071E3C" />
      <stop offset="50%" stop-color="#0B2F5C" />
      <stop offset="100%" stop-color="#05152B" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#FFFFFF" fill-opacity="0.1" />
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Base Background -->
  <rect width="100%" height="100%" fill="url(#bgBase)" />
  <rect width="100%" height="100%" fill="url(#heroGlow1)" />
  <rect width="100%" height="100%" fill="url(#heroGlow2)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Subtle Geometric Shapes in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="1500" cy="300" r="220" />
    <circle cx="1500" cy="300" r="320" stroke-dasharray="8 8" />
    <path d="M 1200 800 L 1700 800" />
    <path d="M 1350 650 L 1350 950" />
    <!-- Rx Symbol Watermark -->
    <text x="1450" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="280" fill="#FFFFFF" stroke="none">Rx</text>
  </g>

  <!-- Highbridge / City Skyline Silhouette Vector Accent at Bottom -->
  <g opacity="0.12" fill="#030B17">
    <path d="M 0 1080 L 0 980 L 80 980 L 80 940 L 150 940 L 150 1000 L 260 1000 L 260 920 L 340 920 L 340 970 L 480 970 L 480 890 L 580 890 L 580 990 L 720 990 L 720 930 L 850 930 L 850 960 L 980 960 L 980 870 L 1090 870 L 1090 980 L 1240 980 L 1240 910 L 1380 910 L 1380 970 L 1520 970 L 1520 890 L 1650 890 L 1650 960 L 1780 960 L 1780 930 L 1920 930 L 1920 1080 Z" />
  </g>
</svg>
