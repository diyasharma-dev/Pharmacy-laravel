<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <defs>
    <!-- Brand Gradients for Dark Backgrounds -->
    <linearGradient id="rspNavyBadgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4FA0" />
      <stop offset="100%" stop-color="#0B2F5C" />
    </linearGradient>
    <linearGradient id="rspCrimsonGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A60" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="rspPillRedDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="rspPillBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="rspEmblemGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Iconic Emblem -->
  <g transform="translate(4, 5)" filter="url(#rspEmblemGlowDark)">
    <!-- Base Shield -->
    <rect width="66" height="66" rx="18" fill="url(#rspNavyBadgeDark)" />
    <rect x="1" y="1" width="64" height="64" rx="17" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Two-Pill Graphic (Storefront Awning Feature) -->
    <g transform="translate(43, 8) rotate(35)">
      <!-- Pill 1: Red / White Capsule -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="6" height="13" rx="3" fill="#FFFFFF" />
        <path d="M0 3 C0 1.34 1.34 0 3 0 C4.66 0 6 1.34 6 3 L6 6.5 L0 6.5 Z" fill="url(#rspPillRedDark)" />
        <line x1="0" y1="6.5" x2="6" y2="6.5" stroke="#7F1D1D" stroke-width="0.5" />
      </g>
      <!-- Pill 2: Blue / White Capsule -->
      <g transform="translate(7, 3) rotate(-20)">
        <rect x="0" y="0" width="5.5" height="12" rx="2.75" fill="#FFFFFF" />
        <path d="M0 2.75 C0 1.23 1.23 0 2.75 0 C4.27 0 5.5 1.23 5.5 2.75 L5.5 6 L0 6 Z" fill="url(#rspPillBlueDark)" />
        <line x1="0" y1="6.5" x2="5.5" y2="6.5" stroke="#1E3A8A" stroke-width="0.5" />
      </g>
    </g>

    <!-- Mortar & Pestle -->
    <g transform="rotate(26 31 35)">
      <rect x="29" y="11" width="6" height="19" rx="3" fill="#FFFFFF" />
      <path d="M29 14 C29 12.5 30 11.5 32 11.5 C34 11.5 35 12.5 35 14 L35 19 L29 19 Z" fill="#E2E8F0" />
    </g>

    <ellipse cx="31" cy="30" rx="19" ry="3.5" fill="#E2E8F0" />
    <ellipse cx="31" cy="29.2" rx="17.5" ry="2.8" fill="#FFFFFF" />
    <path d="M13.5 30 C14 43.5 21 49 31 49 C41 49 48 43.5 48.5 30 Z" fill="#FFFFFF" />

    <path d="M24 48.5 L22 53.5 C22 54.5 40 54.5 40 53.5 L38 48.5 Z" fill="#E2E8F0" />
    <rect x="21" y="52.5" width="20" height="2" rx="1" fill="#FFFFFF" />

    <!-- Inside Mortar: Crimson Rx Monogram -->
    <text x="31" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" fill="url(#rspCrimsonGradDark)" letter-spacing="-0.5">℞</text>
  </g>

  <!-- Typography for Dark Backgrounds -->
  <g transform="translate(80, 8)">
    <!-- Top Row: "R & S" (Crimson Accent) + "PIONEER" (Crisp White) -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" fill="url(#rspCrimsonGradDark)" letter-spacing="-0.5">
        R&amp;S
      </text>

      <circle cx="56" cy="-7" r="2.5" fill="#EF4444" />

      <text x="66" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" fill="#FFFFFF" letter-spacing="-0.2">
        PIONEER
      </text>
    </g>

    <!-- Middle Row: "PHARMACY" in Pure White -->
    <g transform="translate(1, 44)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF" letter-spacing="4.2">
        PHARMACY
      </text>
    </g>

    <!-- Bottom Row: Subtitle -->
    <g transform="translate(1, 57)">
      <line x1="0" y1="-2" x2="238" y2="-2" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
      <circle cx="2" cy="4" r="2" fill="#10B981" />
      <text x="8" y="7" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="8" fill="#94A3B8" letter-spacing="0.6">
        BRONX, NY • EST. 2006 • WE CARE ABOUT YOU!
      </text>
    </g>
  </g>
</svg>
