<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="shieldWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4FA0" />
      <stop offset="100%" stop-color="#0B2F5C" />
    </linearGradient>
    <linearGradient id="accentWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0353B" />
      <stop offset="100%" stop-color="#C1272D" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 8)">
    <rect width="74" height="74" rx="20" fill="url(#shieldWhiteGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
    
    <!-- Medical Cross -->
    <rect x="33" y="15" width="8" height="22" rx="3" fill="url(#accentWhiteGrad)" />
    <rect x="26" y="22" width="22" height="8" rx="3" fill="url(#accentWhiteGrad)" />
    
    <!-- Rx Text -->
    <text x="37" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">Rx</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(98, 14)">
    <!-- Primary Name -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="-0.5">
      R &amp; S <tspan fill="#E0353B">PIONEER</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="1" y="49" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#93C5FD" letter-spacing="3.8">
      PHARMACY
    </text>

    <!-- Tagline & Est. -->
    <g transform="translate(1, 57)">
      <rect width="180" height="15" rx="4" fill="#FFFFFF" fill-opacity="0.12" />
      <circle cx="8" cy="7.5" r="2.5" fill="#E0353B" />
      <text x="16" y="11" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#E8F0FE" letter-spacing="0.5">
        SERVING BRONX SINCE 2006 • 20 YEARS
      </text>
    </g>
  </g>
</svg>
