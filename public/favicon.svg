  </defs>
  <rect width="100" height="100" rx="26" fill="url(#favGrad)" stroke="#1A4FA0" stroke-width="2" />
  <!-- Medical Cross Top Right -->
  <rect x="68" y="14" width="7" height="19" rx="3" fill="url(#crossGrad)" />
  <rect x="62" y="20" width="19" height="7" rx="3" fill="url(#crossGrad)" />
  <!-- Rx Icon -->
  <text x="44" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">Rx</text>
  <text x="50" y="84" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="11" fill="#E8F0FE" letter-spacing="2.5">PIONEER</text>
