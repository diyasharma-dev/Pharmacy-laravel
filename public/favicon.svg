<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F5C" />
      <stop offset="100%" stop-color="#071E3C" />
    </linearGradient>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D54" />
      <stop offset="50%" stop-color="#C1272D" />
      <stop offset="100%" stop-color="#9E1B21" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="100" height="100" rx="26" fill="url(#favShieldGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Pestle -->
  <g transform="rotate(24 50 50)">
    <path d="M46 16 C46 12, 54 12, 54 16 L53 38 L47 38 Z" fill="url(#favRedGrad)" />
    <ellipse cx="50" cy="15" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Mortar Bowl -->
  <path d="M28 38 C28 38, 28 66, 50 66 C72 66, 72 38, 72 38 C66 41, 34 41, 28 38 Z" fill="#FFFFFF" />
  <path d="M25 38 C25 36, 32 34.5, 50 34.5 C68 34.5, 75 36, 75 38 C75 40, 68 41.5, 50 41.5 C32 41.5, 25 40, 25 38 Z" fill="#E8F0FE" />
  <path d="M40 66 L38 73 C38 74.5, 62 74.5, 62 73 L60 66 Z" fill="#E8F0FE" />

  <!-- Inside Mortar: Medical Cross -->
  <g transform="translate(50, 52)">
    <rect x="-2" y="-7.5" width="4" height="15" rx="1.5" fill="url(#favRedGrad)" />
    <rect x="-7.5" y="-2" width="15" height="4" rx="1.5" fill="url(#favRedGrad)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Rx Monogram Bubble at Bottom Right -->
  <circle cx="76" cy="76" r="15" fill="url(#favRedGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  <text x="76" y="82" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">℞</text>
</svg>
